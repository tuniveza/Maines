name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      # CurseForge upload is skipped automatically until this secret exists and
      # Maines.toc has a "## X-Curse-Project-ID:" line.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # packager builds the changelog from git history

      # Builds Maines-<tag>.zip (folder named "Maines", filtered by .pkgmeta), substitutes
      # @project-version@ in the TOC with the tag name, then publishes to GitHub Releases and CurseForge.
      - name: Package and release
        uses: BigWigsMods/packager@v2
